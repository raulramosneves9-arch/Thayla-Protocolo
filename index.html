<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THAYLA — Protocolo Guarannapuava</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <div id="boot">CLIQUE PARA INICIAR O ÁUDIO</div>
  <div id="touch-controls" aria-label="Controles do jogo">
    <div id="move-stick" class="touch-stick" aria-label="Mover personagem">
      <span class="touch-stick-knob"></span>
    </div>
    <div class="touch-actions">
      <button type="button" data-touch-fire>ATIRAR</button>
      <button type="button" data-touch-key="KeyE">USAR</button>
      <button type="button" data-touch-key="Space">ESQUIVA</button>
      <button type="button" data-touch-key="KeyF">FACA</button>
      <button type="button" data-touch-key="KeyI">BOLSA</button>
      <button type="button" data-touch-key="KeyH">ERVA</button>
      <button type="button" data-touch-key="KeyQ">ARMA</button>
    </div>
  </div>

  <script src="js/engine.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/lore.js"></script>
  <script src="js/rooms.js"></script>
  <script src="js/world.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
